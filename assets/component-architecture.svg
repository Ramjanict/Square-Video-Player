<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="deepDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="100%" stop-color="#161e2e"/>
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <linearGradient id="layerGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <linearGradient id="layerGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>

    <linearGradient id="layerGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <linearGradient id="layerGrad4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#deepDark)"/>

  <!-- Header -->
  <text x="400" y="55" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" fill="#ffffff">
    Component &amp; Layer Architecture
  </text>
  <text x="400" y="82" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#94a3b8">
    Stacked visual hierarchy powering the 1:1 squircle video player
  </text>

  <!-- Stacked Layers Container -->
  <g transform="translate(100, 120)">
    <!-- Layer 4: Interactive Seek & Click Handler -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="600" height="74" rx="12" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
      <rect x="16" y="16" width="42" height="42" rx="8" fill="url(#layerGrad4)"/>
      <text x="37" y="42" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="800" fill="#ffffff">L4</text>
      
      <text x="75" y="36" font-family="sans-serif" font-size="16" font-weight="700" fill="#ffffff">Interactive Coordinate Detection Layer</text>
      <text x="75" y="55" font-family="monospace" font-size="12" fill="#cbd5e1">onClick={handleBorderClick} + Ease-in-out timeline lerp</text>
      <rect x="490" y="24" width="90" height="26" rx="6" fill="#8b5cf6" fill-opacity="0.2"/>
      <text x="535" y="41" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#c4b5fd">User Input</text>
    </g>

    <!-- Layer 3: SVG Perimeter Progress Ring -->
    <g transform="translate(0, 95)">
      <rect x="0" y="0" width="600" height="74" rx="12" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
      <rect x="16" y="16" width="42" height="42" rx="8" fill="url(#layerGrad2)"/>
      <text x="37" y="42" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="800" fill="#ffffff">L3</text>
      
      <text x="75" y="36" font-family="sans-serif" font-size="16" font-weight="700" fill="#ffffff">Perimeter Progress Ring (SVG Path)</text>
      <text x="75" y="55" font-family="monospace" font-size="12" fill="#cbd5e1">strokeDasharray + strokeDashoffset + Neon drop-shadow</text>
      <rect x="490" y="24" width="90" height="26" rx="6" fill="#ef4444" fill-opacity="0.2"/>
      <text x="535" y="41" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#fca5a5">SVG Canvas</text>
    </g>

    <!-- Layer 2: Native HTML5 Video Element -->
    <g transform="translate(0, 190)">
      <rect x="0" y="0" width="600" height="74" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
      <rect x="16" y="16" width="42" height="42" rx="8" fill="url(#layerGrad3)"/>
      <text x="37" y="42" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="800" fill="#ffffff">L2</text>
      
      <text x="75" y="36" font-family="sans-serif" font-size="16" font-weight="700" fill="#ffffff">Hardware Accelerated Video Core</text>
      <text x="75" y="55" font-family="monospace" font-size="12" fill="#cbd5e1">&lt;video ref={videoRef} /&gt; + requestAnimationFrame hook</text>
      <rect x="490" y="24" width="90" height="26" rx="6" fill="#10b981" fill-opacity="0.2"/>
      <text x="535" y="41" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#6ee7b7">HTML5 Media</text>
    </g>

    <!-- Layer 1: Squircle Base Frame -->
    <g transform="translate(0, 285)">
      <rect x="0" y="0" width="600" height="74" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
      <rect x="16" y="16" width="42" height="42" rx="8" fill="url(#layerGrad1)"/>
      <text x="37" y="42" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="800" fill="#ffffff">L1</text>
      
      <text x="75" y="36" font-family="sans-serif" font-size="16" font-weight="700" fill="#ffffff">1:1 Squircle Base Frame Container</text>
      <text x="75" y="55" font-family="monospace" font-size="12" fill="#cbd5e1">w-[400px] h-[400px] rounded-[50px] Tailwind container</text>
      <rect x="490" y="24" width="90" height="26" rx="6" fill="#3b82f6" fill-opacity="0.2"/>
      <text x="535" y="41" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#93c5fd">Tailwind CSS</text>
    </g>
  </g>

  <!-- Connective Arrows & Indicator -->
  <g transform="translate(100, 510)">
    <rect x="0" y="0" width="600" height="36" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="300" y="23" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#38bdf8">
      Sync Cycle: Video currentTime ➔ requestAnimationFrame ➔ SVG strokeDashoffset ➔ DOM
    </text>
  </g>
</svg>
