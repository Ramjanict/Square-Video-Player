<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="100%" height="100%">
  <defs>
    <!-- Background gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a14"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#050508"/>
    </linearGradient>

    <radialGradient id="glowRed" cx="75%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowBlue" cx="20%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>

    <!-- Player Neon Glow Filter -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur1"/>
      <feGaussianBlur stdDeviation="20" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="shadowBox" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#000000" flood-opacity="0.8"/>
    </filter>

    <linearGradient id="strokeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3366"/>
      <stop offset="50%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Background Layer -->
  <rect width="1280" height="640" fill="url(#bgGrad)"/>
  <rect width="1280" height="640" fill="url(#glowRed)"/>
  <rect width="1280" height="640" fill="url(#glowBlue)"/>

  <!-- Subtle Grid Lines -->
  <g opacity="0.07" stroke="#94a3b8" stroke-width="1">
    <line x1="0" y1="80" x2="1280" y2="80"/>
    <line x1="0" y1="160" x2="1280" y2="160"/>
    <line x1="0" y1="240" x2="1280" y2="240"/>
    <line x1="0" y1="320" x2="1280" y2="320"/>
    <line x1="0" y1="400" x2="1280" y2="400"/>
    <line x1="0" y1="480" x2="1280" y2="480"/>
    <line x1="0" y1="560" x2="1280" y2="560"/>
    <line x1="160" y1="0" x2="160" y2="640"/>
    <line x1="320" y1="0" x2="320" y2="640"/>
    <line x1="480" y1="0" x2="480" y2="640"/>
    <line x1="640" y1="0" x2="640" y2="640"/>
    <line x1="800" y1="0" x2="800" y2="640"/>
    <line x1="960" y1="0" x2="960" y2="640"/>
    <line x1="1120" y1="0" x2="1120" y2="640"/>
  </g>

  <!-- Left Side: Brand & Copy -->
  <g transform="translate(100, 150)">
    <!-- Badge -->
    <rect x="0" y="0" width="220" height="34" rx="17" fill="#ef4444" fill-opacity="0.15" stroke="#ef4444" stroke-opacity="0.4" stroke-width="1.5"/>
    <circle cx="18" cy="17" r="5" fill="#ef4444"/>
    <text x="32" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#fca5a5" letter-spacing="1">NEXT-GEN MEDIA UI</text>

    <!-- Main Title -->
    <text x="0" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" fill="#ffffff" letter-spacing="-1">
      Square Video
    </text>
    <text x="0" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" fill="url(#strokeGrad)" letter-spacing="-1">
      Player.
    </text>

    <!-- Subtitle -->
    <text x="0" y="205" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400" fill="#94a3b8" width="480">
      <tspan x="0" dy="0">A minimalist 1:1 squircle video experience</tspan>
      <tspan x="0" dy="26">with reactive perimeter SVG path scrubbing.</tspan>
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 270)">
      <rect x="0" y="0" width="130" height="38" rx="19" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="65" y="24" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">⚡ React 19</text>

      <rect x="142" y="0" width="150" height="38" rx="19" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="217" y="24" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">🎨 Tailwind v4</text>

      <rect x="304" y="0" width="165" height="38" rx="19" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="386" y="24" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">📐 SVG Perimeter</text>
    </g>
  </g>

  <!-- Right Side: Illustrated 1:1 Square Player Mockup -->
  <g transform="translate(730, 95)" filter="url(#shadowBox)">
    <!-- Player Outer Squircle Shell (450x450, rx=55) -->
    <rect x="0" y="0" width="450" height="450" rx="55" fill="url(#cardGrad)" stroke="#334155" stroke-width="2"/>

    <!-- Subtle Background Track -->
    <rect x="15" y="15" width="420" height="420" rx="45" fill="none" stroke="#ef4444" stroke-width="8" stroke-opacity="0.15"/>

    <!-- Active Glowing Perimeter SVG Stroke (Partial perimeter progress) -->
    <rect x="15" y="15" width="420" height="420" rx="45" fill="none" stroke="url(#strokeGrad)" stroke-width="8" stroke-dasharray="1680" stroke-dashoffset="620" stroke-linecap="round" filter="url(#neonGlow)"/>

    <!-- Inner Video Viewport -->
    <rect x="42" y="42" width="366" height="366" rx="30" fill="#020617"/>
    
    <!-- Video Simulated Visual Scene -->
    <path d="M 42 300 Q 140 230, 225 270 T 408 240 L 408 408 L 42 408 Z" fill="#0f172a" opacity="0.8"/>
    <path d="M 42 340 Q 160 290, 270 320 T 408 300 L 408 408 L 42 408 Z" fill="#1e1b4b" opacity="0.9"/>
    <circle cx="225" cy="190" r="45" fill="#f43f5e" opacity="0.25" filter="url(#neonGlow)"/>

    <!-- Centered Modern Play Icon HUD -->
    <circle cx="225" cy="225" r="42" fill="#0f172a" fill-opacity="0.75" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.5"/>
    <polygon points="218,208 242,225 218,242" fill="#ffffff"/>

    <!-- Dynamic Pointer Indicator (on the border) -->
    <circle cx="435" cy="270" r="8" fill="#facc15" filter="url(#neonGlow)"/>
    <circle cx="435" cy="270" r="4" fill="#ffffff"/>

    <!-- Floating Timestamp Badge -->
    <g transform="translate(160, 360)">
      <rect x="0" y="0" width="130" height="30" rx="15" fill="#000000" fill-opacity="0.7" stroke="#ffffff" stroke-opacity="0.1"/>
      <circle cx="16" cy="15" r="4" fill="#ef4444"/>
      <text x="70" y="20" text-anchor="middle" font-family="monospace" font-size="12" fill="#ffffff" font-weight="600">01:42 / 03:30</text>
    </g>
  </g>
</svg>
