<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Dark Cyber background -->
    <radialGradient id="cyberBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#030712"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>

    <!-- Cyberpunk Neon Gradient -->
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="cyberGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur1"/>
      <feGaussianBlur stdDeviation="20" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="boxShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="25" stdDeviation="35" flood-color="#06b6d4" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" fill="url(#cyberBg)"/>

  <!-- Cyber Grid -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="0" y1="500" x2="800" y2="500"/>
    <line x1="0" y1="600" x2="800" y2="600"/>
    <line x1="0" y1="700" x2="800" y2="700"/>
    <line x1="100" y1="0" x2="100" y2="800"/>
    <line x1="200" y1="0" x2="200" y2="800"/>
    <line x1="300" y1="0" x2="300" y2="800"/>
    <line x1="400" y1="0" x2="400" y2="800"/>
    <line x1="500" y1="0" x2="500" y2="800"/>
    <line x1="600" y1="0" x2="600" y2="800"/>
    <line x1="700" y1="0" x2="700" y2="800"/>
  </g>

  <!-- Header -->
  <text x="400" y="80" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" fill="#ffffff" letter-spacing="1">
    CYBERPUNK / DARK THEME VARIANT
  </text>
  <text x="400" y="110" text-anchor="middle" font-family="monospace" font-size="14" fill="#06b6d4" letter-spacing="2">
    RGB PERIMETER ILLUMINATION
  </text>

  <!-- Center Player (480x480 at 160, 150) -->
  <g transform="translate(160, 150)" filter="url(#boxShadow)">
    <!-- Base Squircle Case -->
    <rect x="0" y="0" width="480" height="480" rx="55" fill="#0b0f19" stroke="#1e293b" stroke-width="2"/>

    <!-- Track guide -->
    <rect x="16" y="16" width="448" height="448" rx="44" fill="none" stroke="#06b6d4" stroke-width="8" stroke-opacity="0.15"/>

    <!-- Dynamic Neon Perimeter Stroke -->
    <rect x="16" y="16" width="448" height="448" rx="44" fill="none" stroke="url(#cyberGrad)" stroke-width="8" stroke-dasharray="1792" stroke-dashoffset="480" stroke-linecap="round" filter="url(#cyberGlow)"/>

    <!-- Inner Screen Display -->
    <g transform="translate(44, 44)">
      <rect x="0" y="0" width="392" height="392" rx="28" fill="#030712"/>

      <!-- Ambient Visuals -->
      <circle cx="196" cy="180" r="90" fill="#8b5cf6" opacity="0.25" filter="url(#cyberGlow)"/>
      <circle cx="120" cy="240" r="60" fill="#06b6d4" opacity="0.2" filter="url(#cyberGlow)"/>

      <!-- Soundwave Bars visual -->
      <g transform="translate(76, 280)" fill="url(#cyberGrad)" opacity="0.85">
        <rect x="0" y="20" width="8" height="40" rx="4"/>
        <rect x="18" y="5" width="8" height="55" rx="4"/>
        <rect x="36" y="15" width="8" height="45" rx="4"/>
        <rect x="54" y="0" width="8" height="60" rx="4"/>
        <rect x="72" y="22" width="8" height="38" rx="4"/>
        <rect x="90" y="8" width="8" height="52" rx="4"/>
        <rect x="108" y="25" width="8" height="35" rx="4"/>
        <rect x="126" y="2" width="8" height="58" rx="4"/>
        <rect x="144" y="18" width="8" height="42" rx="4"/>
        <rect x="162" y="10" width="8" height="50" rx="4"/>
        <rect x="180" y="24" width="8" height="36" rx="4"/>
        <rect x="198" y="5" width="8" height="55" rx="4"/>
        <rect x="216" y="16" width="8" height="44" rx="4"/>
        <rect x="234" y="28" width="8" height="32" rx="4"/>
      </g>

      <!-- Glass Center Play Button -->
      <circle cx="196" cy="180" r="42" fill="#0f172a" fill-opacity="0.6" stroke="#06b6d4" stroke-width="2" filter="url(#cyberGlow)"/>
      <polygon points="188,162 214,180 188,198" fill="#ffffff"/>
    </g>

    <!-- Cyan Glow Cursor on perimeter -->
    <g transform="translate(16, 290)">
      <circle cx="0" cy="0" r="10" fill="#06b6d4" filter="url(#cyberGlow)"/>
      <circle cx="0" cy="0" r="5" fill="#ffffff"/>
    </g>
  </g>

  <!-- Footer Tagline -->
  <g transform="translate(400, 715)">
    <text text-anchor="middle" font-family="monospace" font-size="14" fill="#64748b">
      &lt;SquareVideoPlayer theme="cyberpunk" neonGlow={true} /&gt;
    </text>
  </g>
</svg>
