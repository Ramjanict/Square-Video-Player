<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <filter id="accentGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgDark)"/>

  <!-- Header -->
  <text x="400" y="55" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" fill="#ffffff">
    Perimeter Click-to-Seek Architecture
  </text>
  <text x="400" y="82" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#9ca3af">
    How 4-edge squircle coordinates map to video timeline timestamps
  </text>

  <!-- Squircle Central Diagram Box -->
  <g transform="translate(230, 140)">
    <!-- Main Center Squircle Box (340x340) -->
    <rect x="0" y="0" width="340" height="340" rx="40" fill="#1f2937" stroke="#374151" stroke-width="2"/>

    <!-- Inner Video placeholder -->
    <rect x="25" y="25" width="290" height="290" rx="20" fill="#111827" stroke="#374151" stroke-width="1"/>
    <text x="145" y="165" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#6b7280">VIDEO VIEWPORT</text>
    <text x="145" y="190" text-anchor="middle" font-family="monospace" font-size="13" fill="#9ca3af">currentTime: t</text>

    <!-- Edge 1: TOP (0% -> 25%) -->
    <path d="M 40 10 L 300 10" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" filter="url(#accentGlow)"/>
    <polygon points="170,4 178,10 170,16" fill="#38bdf8"/>

    <!-- Edge 2: RIGHT (25% -> 50%) -->
    <path d="M 330 40 L 330 300" stroke="#34d399" stroke-width="6" stroke-linecap="round" filter="url(#accentGlow)"/>
    <polygon points="324,170 330,178 336,170" fill="#34d399"/>

    <!-- Edge 3: BOTTOM (50% -> 75%) -->
    <path d="M 300 330 L 40 330" stroke="#fbbf24" stroke-width="6" stroke-linecap="round" filter="url(#accentGlow)"/>
    <polygon points="170,324 162,330 170,336" fill="#fbbf24"/>

    <!-- Edge 4: LEFT (75% -> 100%) -->
    <path d="M 10 300 L 10 40" stroke="#f87171" stroke-width="6" stroke-linecap="round" filter="url(#accentGlow)"/>
    <polygon points="4,170 10,162 16,170" fill="#f87171"/>
  </g>

  <!-- Left Annotation: Edge 4 & Edge 1 -->
  <g transform="translate(40, 240)">
    <rect x="0" y="0" width="160" height="60" rx="10" fill="#1e293b" stroke="#f87171" stroke-width="1.5"/>
    <text x="80" y="26" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#f87171">Edge 4: Left Side</text>
    <text x="80" y="46" text-anchor="middle" font-family="monospace" font-size="12" fill="#e2e8f0">75% → 100%</text>
  </g>

  <g transform="translate(320, 100)">
    <rect x="0" y="0" width="160" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="80" y="21" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#38bdf8">Edge 1: Top (0% → 25%)</text>
  </g>

  <!-- Right Annotation: Edge 2 -->
  <g transform="translate(600, 240)">
    <rect x="0" y="0" width="160" height="60" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
    <text x="80" y="26" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#34d399">Edge 2: Right Side</text>
    <text x="80" y="46" text-anchor="middle" font-family="monospace" font-size="12" fill="#e2e8f0">25% → 50%</text>
  </g>

  <!-- Bottom Annotation: Edge 3 -->
  <g transform="translate(320, 495)">
    <rect x="0" y="0" width="160" height="32" rx="16" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="80" y="21" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#fbbf24">Edge 3: Bottom (50% → 75%)</text>
  </g>

  <!-- Footer Formula Bar -->
  <g transform="translate(100, 545)">
    <rect x="0" y="0" width="600" height="38" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="300" y="24" text-anchor="middle" font-family="monospace" font-size="13" fill="#cbd5e1">
      Distance = Edge_Offset + (Cursor_Coord - Padding) ➔ Progress = Distance / Perimeter
    </text>
  </g>
</svg>
